<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillFlow | Internal Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Using a professional font stack -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* 
   THEME CONSTANTS
   Senior devs define these first so the whole app looks consistent.
*/
        :root {
            --color-black: #050505;
            --color-surface: #0c0c0c;
            --color-border: #1f1f1f;
            --color-primary: #635bff;
            --color-primary-hover: #7a73ff;
            --color-text: #ffffff;
            --color-text-muted: #888888;

            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 2rem;

            --radius-main: 8px;
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
        }

        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-black);
            color: var(--color-text);
            font-family: var(--font-main);
            -webkit-font-smoothing: antialiased;
        }

        /* LAYOUT */
        .dashboard-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: var(--color-surface);
            border-right: 1px solid var(--color-border);
            display: flex;
            flex-direction: column;
            padding: var(--spacing-lg) var(--spacing-md);
        }

        .main-content {
            flex: 1;
            padding: var(--spacing-lg) 3rem;
            overflow-y: auto;
        }

        /* COMPONENTS: Sidebar */
        .sidebar__brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 2.5rem;
        }

        .logo-box {
            width: 32px;
            height: 32px;
            background: var(--color-primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon {
            width: 20px;
            color: white;
        }

        .nav-group__label {
            font-size: 0.7rem;
            color: var(--color-text-muted);
            letter-spacing: 0.05em;
            margin: 1.5rem 0 0.75rem 0.75rem;
        }

        .nav-list {
            list-style: none;
        }

        .nav-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            color: var(--color-text);
            text-decoration: none;
            font-size: 0.9rem;
            border-radius: var(--radius-main);
            transition: background 0.2s;
        }

        .nav-item:hover {
            background: #161616;
        }

        .nav-item--active {
            background: rgba(99, 91, 255, 0.1);
            color: var(--color-primary);
            font-weight: 500;
        }

        .counter {
            background: var(--color-primary);
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* COMPONENTS: Header & Actions */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .search-input {
            background: #111;
            border: 1px solid var(--color-border);
            color: white;
            padding: 12px 16px;
            border-radius: var(--radius-main);
            width: 340px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--color-primary);
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: var(--radius-main);
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn--primary {
            background: var(--color-primary);
            color: white;
            border: none;
        }

        .btn--primary:hover {
            background: var(--color-primary-hover);
        }

        .btn--outline {
            background: transparent;
            color: white;
            border: 1px solid var(--color-border);
        }

        .btn--outline:hover {
            background: #111;
        }

        /* COMPONENTS: Cards */
        .grid-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        .card {
            background: var(--color-surface);
            border-radius: 12px;
            border: 1px solid var(--color-border);
            padding: 1.5rem;
            min-height: 400px;
        }

        .card__header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .card__title {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .card__divider {
            height: 1px;
            background: var(--color-border);
            margin: 0 -1.5rem 1.5rem -1.5rem;
        }

        .btn-link {
            background: transparent;
            border: 1px solid var(--color-border);
            color: var(--color-text-muted);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* User Profile Footer */
        .user-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 1.5rem;
            border-top: 1px solid var(--color-border);
        }

        .user-pill__avatar {
            width: 36px;
            height: 36px;
            background: #222;
            border: 1px solid var(--color-primary);
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 0.8rem;
        }

        .user-name {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .user-role {
            display: block;
            font-size: 0.75rem;
            color: var(--color-text-muted);
        }
    </style>
</head>

<body>

    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <header class="sidebar__brand">
                <div class="logo-box">
                    <svg viewBox="0 0 24 24" class="logo-icon">
                        <path fill="currentColor" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                </div>
                <h1 class="brand-name">BillFlow</h1>
            </header>

            <nav class="sidebar__nav" aria-label="Main Navigation">
                <section class="nav-group">
                    <h2 class="nav-group__label">OVERVIEW</h2>
                    <ul class="nav-list">
                        <li><a href="#" class="nav-item nav-item--active">Dashboard</a></li>
                    </ul>
                </section>

                <section class="nav-group">
                    <h2 class="nav-group__label">CUSTOMERS</h2>
                    <ul class="nav-list">
                        <li>
                            <a href="#" class="nav-item">
                                Customers <span class="counter">0</span>
                            </a>
                        </li>
                    </ul>
                </section>

                <section class="nav-group">
                    <h2 class="nav-group__label">FINANCE</h2>
                    <ul class="nav-list">
                        <li><a href="#" class="nav-item">Transactions <span class="counter">0</span></a></li>
                        <li><a href="#" class="nav-item">Balance</a></li>
                        <li><a href="#" class="nav-item">History</a></li>
                    </ul>
                </section>
            </nav>

            <footer class="sidebar__footer">
                <div class="user-pill">
                    <div class="user-pill__avatar">A</div>
                    <div class="user-pill__text">
                        <span class="user-name">Admin</span>
                        <span class="user-role">Billing Manager</span>
                    </div>
                </div>
            </footer>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <h2 class="page-title">Dashboard</h2>

                <div class="top-bar__actions">
                    <div class="search-container">
                        <input type="search" placeholder="Search customers, transactions..." class="search-input">
                    </div>
                    <div class="button-group">
                        <button class="btn btn--outline">+ Transaction</button>
                        <button class="btn btn--primary">+ Customer</button>
                    </div>
                </div>
            </header>

            <div class="grid-layout">
                <section class="card card--main">
                    <div class="card__header">
                        <h3 class="card__title">Recent transactions</h3>
                        <button class="btn-link">View all</button>
                    </div>
                    <div class="card__divider"></div>
                    <div class="card__body empty-state">
                        <!-- Content injection point -->
                    </div>
                </section>

                <section class="card card--sidebar">
                    <div class="card__header">
                        <h3 class="card__title">Top customers</h3>
                    </div>
                    <div class="card__divider"></div>
                    <div class="card__body empty-state">
                        <!-- Content injection point -->
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Minimal JS for interactivity -->
    <script src="app.js"></script>
</body>

</html>
